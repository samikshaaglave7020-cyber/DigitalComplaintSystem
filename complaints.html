<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>View Complaints</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>

    <h2>Complaint Management System</h2>

    <div>
        <a href="index.html">Home</a>
        <a href="submit.html">Submit Complaint</a>
        <a href="complaints.html">View Complaints</a>
    </div>

</nav>


<section class="complaints-container">

    <h1>Submitted Complaints</h1>

    <div id="complaintList"></div>

</section>


<script>

function displayComplaints() {

    let complaints =
        JSON.parse(localStorage.getItem("complaints")) || [];

    let complaintList =
        document.getElementById("complaintList");

    complaintList.innerHTML = "";

    if (complaints.length === 0) {

        complaintList.innerHTML =
            "<p>No complaints submitted yet.</p>";

        return;
    }


    complaints.forEach(function(complaint, index) {

        let card = document.createElement("div");

        card.className = "complaint-card";

        card.innerHTML =

            "<h3>Complaint ID: " +
            complaint.id +
            "</h3>" +

            "<p><strong>Class:</strong> " +
            complaint.class +
            "</p>" +

            "<p><strong>Category:</strong> " +
            complaint.category +
            "</p>" +

            "<p><strong>Complaint:</strong> " +
            complaint.complaint +
            "</p>" +

            "<label><strong>Status:</strong></label>" +

            "<select onchange='updateStatus(" +
            index +
            ", this.value)'>" +

            "<option value='Pending' " +
            (complaint.status === "Pending" ? "selected" : "") +
            ">Pending</option>" +

            "<option value='In Progress' " +
            (complaint.status === "In Progress" ? "selected" : "") +
            ">In Progress</option>" +

            "<option value='Resolved' " +
            (complaint.status === "Resolved" ? "selected" : "") +
            ">Resolved</option>" +

            "</select>";

        complaintList.appendChild(card);

    });

}


function updateStatus(index, newStatus) {

    let complaints =
        JSON.parse(localStorage.getItem("complaints")) || [];

    complaints[index].status = newStatus;

    localStorage.setItem(
        "complaints",
        JSON.stringify(complaints)
    );

    alert("Complaint status updated successfully!");

}


displayComplaints();

</script>

</body>

</html>
